  <style>
    html, body { margin: 0; height: 100%; background: #FFF7EA; }
    /* Shown from the first byte until Flutter paints its first frame. */
    #kw-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: #FFF7EA; transition: opacity 220ms ease-out; z-index: 10;
    }
    #kw-splash.gone { opacity: 0; pointer-events: none; }
    #kw-splash svg {
      width: 104px; height: 104px;
      filter: drop-shadow(0 10px 18px rgba(42, 27, 94, .22));
      animation: kw-bob 1.4s ease-in-out infinite;
    }
    #kw-splash .dots { display: flex; gap: 8px; }
    #kw-splash .dots i {
      width: 8px; height: 8px; border-radius: 50%; background: #5B3DF5; opacity: .3;
      animation: kw-dot 1.2s ease-in-out infinite;
    }
    #kw-splash .dots i:nth-child(2) { animation-delay: .15s; }
    #kw-splash .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes kw-bob { 50% { transform: translateY(-6px) rotate(-3deg); } }
    @keyframes kw-dot { 40% { opacity: 1; transform: translateY(-3px); } }
    html.kw-dark, html.kw-dark body, html.kw-dark #kw-splash { background: #1E1547; }
    html.kw-dark #kw-splash .dots i { background: #FFD23F; }
    @media (prefers-reduced-motion: reduce) {
      #kw-splash svg, #kw-splash .dots i { animation: none; }
    }
  </style>

  <script>
    // Match the splash to the theme the app will open in, so a night-theme
    // player gets no cream flash. Settings live in localStorage (shared_preferences).
    (function () {
      try {
        var raw = localStorage.getItem('flutter.settings');
        var mode = raw ? JSON.parse(JSON.parse(raw)).themeMode : 'light';
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('kw-dark');
      } catch (e) {}
    })();
  </script>

  <script>
    (function () {
      var hide = function () {
        var el = document.getElementById('kw-splash');
        if (!el) return;
        el.classList.add('gone');
        setTimeout(function () { el.remove(); }, 300);
      };
      window.addEventListener('flutter-first-frame', hide, { once: true });
      setTimeout(hide, 20000); // never cover the app for good
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Offline: sw.js keeps the last build this device saw, as a fallback only
    // (online everything still revalidates, see the comment in sw.js).
    // Flutter's own worker from older builds kept stale builds alive; it is
    // removed here and its caches are dropped by sw.js on activation.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) {
          var w = r.active || r.waiting || r.installing;
          if (w && !/\/sw\.js(\?|$)/.test(w.scriptURL)) r.unregister();
        });
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
      // What loaded before the worker took over (the first visit): hand the
      // list over so the renderer and fonts are there offline too.
      window.addEventListener('flutter-first-frame', function () {
        setTimeout(function () {
          navigator.serviceWorker.ready.then(function (reg) {
            var urls = performance.getEntriesByType('resource')
              .map(function (e) { return e.name; })
              .filter(function (u) { return u.indexOf(location.origin) === 0; });
            if (reg.active) reg.active.postMessage({ type: 'kw-cache', urls: urls });
          });
        }, 4000);
      }, { once: true });
    }
  </script>
  <script>
    // Flutter paints every pixel itself. A phone at 3x pixels makes it paint
    // 2.25 times as many as at 2x, for a difference you cannot see at arm's
    // length; on a phone's GPU that is the gap between smooth and stutter.
    // So the app renders at most at 2x.
    // Always the real value, capped: some browsers only settle on their
    // ratio after the page has started (and zooming changes it).
    (function () {
      var d = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio') ||
        Object.getOwnPropertyDescriptor(Window.prototype, 'devicePixelRatio');
      if (!d || !d.get) return;
      var real = d.get;
      try {
        Object.defineProperty(window, 'devicePixelRatio', {
          get: function () { return Math.min(2, real.call(window) || 1); },
          configurable: true,
        });
      } catch (e) {}
    })();
  </script>
